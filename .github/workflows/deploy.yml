# Od 21. 10. 2026 sa nasadzuje statický web SOFT SLAB zo staticky/ (pripraví ~/AI/EASYCHECK/scripts/web-nasad.sh).
# Astro (src/) ostáva v repe na neskorší prenos, ale nebuildí sa.
name: Deploy staticky/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: staticky

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
